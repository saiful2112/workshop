      const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);

      const [editingBook, setEditingBook] = useState(null);

      const [bookToPrint, setBookToPrint] = useState(null);

      const [timeStr, setTimeStr] = useState('09:00:00');

        const timer = setInterval(() => {
          const now = new Date();
          setTimeStr(now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const showToast = (text, type = 'success') => {
        setToast({ text, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Computed Stats
      const stats = useMemo(() => {
        const totalTitles = books.length;
        const availableShelfStock = books.reduce((acc, b) => acc + b.availableStock, 0);
        const activeLoans = transactions.filter((t) => t.status === 'DIPINJAM' || t.status === 'TERLAMBAT').length;
        const completedReturns = transactions.filter((t) => t.status === 'KEMBALI').length;
        const totalTrx = transactions.length;
        const returnRatePercent = totalTrx > 0 ? Math.round((completedReturns / totalTrx) * 100) : 91;

        return {
          totalTitles,
          newTitlesThisMonth: 6,
          availableShelfStock,
          activeLoans,
          completedReturns,
          returnRatePercent,
          terminalId: 'POS-SIRKULASI-01',
          archiveCode: 'ARC-TRX-2026.Q1',
        };
      }, [books, transactions]);

      // Actions
      const handleBorrow = (data) => {
        const book = books.find((b) => b.id === data.bookId);
        if (!book || book.availableStock <= 0) {
          showToast('Gagal meminjam: Stok buku habis.', 'error');
          return;
        }

        const updatedBooks = books.map((b) => {
          if (b.id === data.bookId) {
            return { ...b, availableStock: b.availableStock - 1, borrowedStock: b.borrowedStock + 1 };
          }
          return b;
        });
        setBooks(updatedBooks);

        if (selectedBook && selectedBook.id === data.bookId) {
          setSelectedBook({ ...selectedBook, availableStock: selectedBook.availableStock - 1, borrowedStock: selectedBook.borrowedStock + 1 });
        }

        const nextNum = 813 + transactions.length;
        const today = new Date().toISOString().split('T')[0];
        const due = new Date();
        due.setDate(due.getDate() + Number(data.daysToBorrow || 7));
        const dueDate = due.toISOString().split('T')[0];

        const newTx = {
          id: `PJM-2026-0${nextNum}`,
          borrowerName: data.borrowerName,
          borrowerId: data.borrowerId,
          borrowerType: data.borrowerType || 'MAHASISWA',
          bookId: book.id,
          bookTitle: book.title,
          bookAuthor: book.author,
          borrowDate: today,
          dueDate,
          status: 'DIPINJAM',
          fineAmount: 0,
          notes: data.notes || `Peminjaman mandiri selama ${data.daysToBorrow} hari kerja.`,
        };

        setTransactions([newTx, ...transactions]);
        showToast(`Peminjaman "${book.title}" (${newTx.id}) berhasil dicatat!`, 'success');
      };

      const handleReturn = (txId) => {
        const tx = transactions.find((t) => t.id === txId);
        if (!tx) return;
        if (tx.status === 'KEMBALI') {
          showToast('Buku pada transaksi ini sudah pernah dikembalikan (pencegahan pengembalian ganda).', 'error');
          return;
        }

        const updatedBooks = books.map((b) => {
          if (b.id === tx.bookId) {
            return { ...b, availableStock: Math.min(b.totalStock, b.availableStock + 1), borrowedStock: Math.max(0, b.borrowedStock - 1) };
          }
          return b;
        });
        setBooks(updatedBooks);

        if (selectedBook && selectedBook.id === tx.bookId) {
          setSelectedBook({ ...selectedBook, availableStock: Math.min(selectedBook.totalStock, selectedBook.availableStock + 1), borrowedStock: Math.max(0, selectedBook.borrowedStock - 1) });
        }

        const today = new Date().toISOString().split('T')[0];
        const updatedTxs = transactions.map((t) => {
          if (t.id === txId) {
            return {
              ...t,
              status: 'KEMBALI',
              returnDate: today,
              notes: (t.notes ? t.notes + ' · ' : '') + `Dikembalikan pada ${today}. Rekonsiliasi fisik +1 eksemplar.`,
            };
          }
          return t;
        });
        setTransactions(updatedTxs);
        showToast(`Buku "${tx.bookTitle}" berhasil dikembalikan. Stok fisik +1!`, 'success');
      };

      const handleSaveBook = (bookData) => {
        if (bookData.id) {
          setBooks(books.map((b) => (b.id === bookData.id ? { ...b, ...bookData } : b)));
          if (selectedBook?.id === bookData.id) {
            setSelectedBook({ ...selectedBook, ...bookData });
          }
          showToast(`Data buku "${bookData.title}" berhasil diperbarui.`, 'success');
        } else {
          const nextId = `B0${String(books.length + 1).padStart(2, '0')}`;
          const newBook = {
            id: nextId,
            title: bookData.title || 'Buku Baru',
            author: bookData.author || 'Penulis',
            publisher: bookData.publisher || 'Penerbit Pustaka',

            shelfLocation: bookData.shelfLocation || 'Rak Meja 01',
            category: bookData.category || 'Koleksi Umum',
            totalStock: Number(bookData.totalStock || 1),
            availableStock: Number(bookData.totalStock || 1),
            borrowedStock: 0,
            isStandardCover: bookData.isStandardCover ?? true,
            maxBorrowDays: 7,
            synopsis: bookData.synopsis || '',
          };
          setBooks([newBook, ...books]);
          setSelectedBook(newBook);
          showToast(`Buku "${newBook.title}" (ID: ${newBook.id}) berhasil ditambahkan ke katalog master!`, 'success');
        }
      };

      const handleScan = (code) => {
        const trimmed = code.trim().toUpperCase();
        const tx = transactions.find((t) => t.id.toUpperCase() === trimmed);
        if (tx) {
          setActiveTab('riwayat');
          if (tx.status === 'DIPINJAM' || tx.status === 'TERLAMBAT') {
            setTransactionToReturn(tx);
            setIsReturnModalOpen(true);
          } else {
            showToast(`Transaksi ${tx.id} telah selesai dikembalikan.`, 'info');
          }
          return;
        }

        const book = books.find((b) => b.id.toUpperCase() === trimmed || b.isbn.replace(/-/g, '').includes(trimmed.replace(/-/g, '')));
        if (book) {
          setSelectedBook(book);
          setActiveTab('katalog');
          showToast(`Buku ditemukan: ${book.title} (${book.shelfLocation})`, 'info');
          return;
        }

        showToast(`Kode "${code}" tidak ditemukan dalam basis data sirkulasi.`, 'error');

                    <div className="text-xs font-mono font-bold text-[#666666] mb-1">Simulasi Pindai Cepat:</div>
                    <div className="flex flex-wrap gap-1.5">
                      {['B001', 'B002', 'B004', 'PJM-2026-0812', 'PJM-2026-0808'].map((c) => (
                        <button
                          key={c}
                          onClick={() => {
                            handleScan(c);
                            setIsScannerModalOpen(false);
                          }}
                          className="px-2.5 py-1 text-xs font-mono rounded border border-[#1E1E1E] bg-white hover:bg-[#C85A17] hover:text-white"
                        >
                          {c}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {isPrintLabelModalOpen && bookToPrint && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-[#FBF9F5] rounded-2xl border-2 border-[#1E1E1E] shadow-[8px_8px_0_0_#1E1E1E] max-w-md w-full overflow-hidden">
                <div className="bg-[#EBE5D8] px-6 py-4 border-b-2 border-[#1E1E1E] flex items-center justify-between">
                  <h3 className="font-serif font-bold text-lg text-[#1F2421]">Cetak Label Punggung & Barcode</h3>
                  <button onClick={() => setIsPrintLabelModalOpen(false)} className="w-8 h-8 rounded-lg border border-[#1E1E1E] bg-white flex items-center justify-center">✕</button>
                </div>
                <div className="p-6 space-y-4 text-center">
                  <div className="p-4 bg-white border-2 border-dashed border-[#1E1E1E] rounded-xl flex flex-col items-center space-y-2">
                    <div className="text-[10px] font-mono font-bold text-[#777777] uppercase">PERPUSTAKAAN MEJA LAYANAN</div>
                    <div className="text-sm font-serif font-bold text-[#1F2421]">{bookToPrint.title}</div>
                    <div className="border-2 border-[#1E1E1E] p-2 bg-[#FBF9F5] rounded w-32 font-mono">
                      <div className="text-[9px] text-[#777777]">KODE PUNGGUNG</div>
                      <div className="text-base font-bold text-[#1F2421]">{bookToPrint.ddc}</div>
                      <div className="text-xs font-bold text-[#C85A17] uppercase">{bookToPrint.author.slice(0, 3)}</div>
                      <div className="text-[9px] text-[#555555] border-t border-[#D9D2C5] mt-1 pt-0.5">{bookToPrint.shelfLocation}</div>
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-2">
                    <button onClick={() => setIsPrintLabelModalOpen(false)} className="px-4 py-2 rounded-lg border-2 border-[#1E1E1E] bg-white text-xs font-mono font-bold">Tutup</button>
                    <button onClick={() => window.print()} className="px-5 py-2 rounded-lg border-2 border-[#1E1E1E] bg-[#C85A17] text-white text-xs font-mono font-bold shadow-[2px_2px_0_0_#1E1E1E]">Cetak Sekarang</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {isAddBookModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-[#FBF9F5] rounded-2xl border-2 border-[#1E1E1E] shadow-[8px_8px_0_0_#1E1E1E] max-w-lg w-full max-h-[90vh] overflow-y-auto">
                <div className="bg-[#EBE5D8] px-6 py-4 border-b-2 border-[#1E1E1E] flex items-center justify-between sticky top-0 z-10">
                  <h3 className="font-serif font-bold text-lg text-[#1F2421]">
                    {editingBook ? 'Ubah Data Buku' : 'Tambah Buku Baru'}
                  </h3>
                  <button onClick={() => setIsAddBookModalOpen(false)} className="w-8 h-8 rounded-lg border border-[#1E1E1E] bg-white flex items-center justify-center">✕</button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleSaveBook({
                      id: editingBook?.id,
                      title: form.title.value,
                      author: form.author.value,
                      publisher: form.publisher.value,
                      year: Number(form.year.value),
                      isbn: form.isbn.value,
                      ddc: form.ddc.value,
                      shelfLocation: form.shelfLocation.value,
                      totalStock: Number(form.totalStock.value),
                    });
                    setIsAddBookModalOpen(false);
                  }}
                  className="p-6 space-y-4"
                >
                  <div>
                    <label className="block text-xs font-mono font-bold mb-1">Judul Buku *</label>
                    <input name="title" defaultValue={editingBook?.title || ''} required placeholder="Contoh: Cantik Itu Luka" className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg font-serif" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-mono font-bold mb-1">Pengarang *</label>
                      <input name="author" defaultValue={editingBook?.author || ''} required className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-xs font-mono font-bold mb-1">Penerbit *</label>
                      <input name="publisher" defaultValue={editingBook?.publisher || ''} required className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg" />
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-mono font-bold mb-1">Tahun</label>
                      <input name="year" type="number" defaultValue={editingBook?.year || 2026} className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-mono font-bold mb-1">DDC</label>
                      <input name="ddc" defaultValue={editingBook?.ddc || '899.2'} className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-mono font-bold mb-1">Stok Eks *</label>
                      <input name="totalStock" type="number" defaultValue={editingBook?.totalStock || 5} min="0" required className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg font-mono font-bold" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-mono font-bold mb-1">ISBN</label>
                      <input name="isbn" defaultValue={editingBook?.isbn || '978-602-000-0'} className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg font-mono" />
                    </div>
                    <div>
                      <label className="block text-xs font-mono font-bold mb-1">Lokasi Rak</label>
                      <input name="shelfLocation" defaultValue={editingBook?.shelfLocation || 'Rak B-04'} className="w-full px-3 py-2 text-sm bg-white border-2 border-[#1E1E1E] rounded-lg" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-2">
                    <button type="button" onClick={() => setIsAddBookModalOpen(false)} className="px-4 py-2 rounded-lg border-2 border-[#1E1E1E] bg-white text-xs font-mono font-bold">Batal</button>
                    <button type="submit" className="px-5 py-2 rounded-lg border-2 border-[#1E1E1E] bg-[#C85A17] text-white text-xs font-mono font-bold shadow-[2px_2px_0_0_#1E1E1E]">Simpan Buku</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TOAST */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 animate-fadeIn">
              <div className={`px-4 py-3 rounded-xl border-2 border-[#1E1E1E] shadow-[4px_4px_0_0_#1E1E1E] text-xs font-mono font-bold flex items-center gap-3 ${
                toast.type === 'error' ? 'bg-rose-100 text-rose-900' : toast.type === 'info' ? 'bg-amber-100 text-amber-900' : 'bg-emerald-100 text-emerald-900'
              }`}>
                <span>{toast.text}</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
